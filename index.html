<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bhumi's Galaxy ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #030014; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #ui-overlay {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 10; text-align: center; color: #fff; pointer-events: none;
      width: 90%; max-width: 400px;
    }
    h1 {
      font-size: 1.8rem; font-weight: 300; letter-spacing: 2px;
      background: linear-gradient(90deg, #ff71ce, #01cdfe, #05ffa1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 113, 206, 0.5);
    }
    p { font-size: 0.9rem; color: #a5b4fc; margin-top: 8px; opacity: 0.85; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-overlay">
  <h1>✨ Explore Bhumi's Galaxy ✨</h1>
  <p>Move around to discover the hidden stars</p>
</div>

<script>
  let scene, camera, renderer, particlesMesh;
  let mouseX = 0, mouseY = 0;
  let targetX = 0, targetY = 0;
  const textCards = [];

  // Messages to float inside the galaxy
  const messages = [
    "Bhumi is cute 💖",
    "Bhumi is pagal 🤪",
    "Bhumi is bauni 🤏",
    "Bhumi is short temper 😤",
    "Bhumi is the best ✨",
    "Star of the Universe ⭐"
  ];

  // Helper function to turn dynamic text into a 3D Texture
  function createTextTexture(text) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 512;
    canvas.height = 128;

    // Background card glow
    ctx.fillStyle = 'rgba(15, 10, 35, 0.75)';
    ctx.strokeStyle = '#ff71ce';
    ctx.lineWidth = 4;
    
    // Rounded box outline
    ctx.beginPath();
    ctx.roundRect(10, 10, 492, 108, 20);
    ctx.fill();
    ctx.stroke();

    // Text style
    ctx.font = 'bold 32px "Segoe UI", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#01cdfe';
    ctx.shadowBlur = 12;
    ctx.fillText(text, 256, 64);

    const texture = new THREE.CanvasTexture(canvas);
    return texture;
  }

  function init() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030014, 0.02);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 28;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Create 3D Particle Heart Galaxy
    const particleCount = 2800;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      const t = Math.random() * Math.PI * 2;
      const u = (Math.random() - 0.5) * 2;
      
      // Heart parametric equation
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      let z = u * 8;

      // Scale down & introduce turbulence scatter
      x = (x * 0.65) + (Math.random() - 0.5) * 4;
      y = (y * 0.65) + (Math.random() - 0.5) * 4;
      z = z + (Math.random() - 0.5) * 4;

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      // Cyberpunk Pastel Palette
      colors[i * 3] = 0.9 + Math.random() * 0.1;       // Red
      colors[i * 3 + 1] = 0.3 + Math.random() * 0.4;   // Green
      colors[i * 3 + 2] = 0.8 + Math.random() * 0.2;   // Blue
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.28,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    });

    particlesMesh = new THREE.Points(geometry, material);
    scene.add(particlesMesh);

    // Create 3D Floating Message Cards
    messages.forEach((msg, index) => {
      const texture = createTextTexture(msg);
      const cardGeo = new THREE.PlaneGeometry(6, 1.5);
      const cardMat = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.95
      });

      const card = new THREE.Mesh(cardGeo, cardMat);
      
      // Orbit placements around the heart constellation
      const angle = (index / messages.length) * Math.PI * 2;
      const radius = 13 + (Math.random() * 3);
      card.position.set(Math.cos(angle) * radius, Math.sin(angle) * (radius * 0.6), (Math.random() - 0.5) * 10);
      
      scene.add(card);
      textCards.push(card);
    });

    // Event Listeners for Touch/Mouse Interaction
    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('touchmove', onPointerMove);
    window.addEventListener('resize', onWindowResize);

    animate();
  }

  function onPointerMove(e) {
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);

    if (clientX && clientY) {
      mouseX = (clientX - window.innerWidth / 2) * 0.0008;
      mouseY = (clientY - window.innerHeight / 2) * 0.0008;
    }
  }

  function animate() {
    requestAnimationFrame(animate);

    targetX += (mouseX - targetX) * 0.05;
    targetY += (mouseY - targetY) * 0.05;

    // Rotate Galaxy Core
    particlesMesh.rotation.y += 0.0025;
    particlesMesh.rotation.x = targetY * 0.6;
    particlesMesh.rotation.y += targetX * 0.6;

    // Gently float and face text cards toward camera
    textCards.forEach((card, idx) => {
      card.rotation.y += 0.003;
      card.position.y += Math.sin(Date.now() * 0.0015 + idx) * 0.008;
    });

    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  window.onload = init;
</script>
</body>
</html>
