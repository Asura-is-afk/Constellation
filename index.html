<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A Galaxy for You ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #030014; font-family: 'Segoe UI', system-ui, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #ui-overlay {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 10; text-align: center; color: #fff; pointer-events: none;
    }
    h1 {
      font-size: 1.8rem; font-weight: 300; letter-spacing: 3px;
      background: linear-gradient(90deg, #ff71ce, #01cdfe, #05ffa1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 113, 206, 0.5);
    }
    p { font-size: 0.9rem; color: #a5b4fc; margin-top: 8px; opacity: 0.8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-overlay">
  <h1>✨ Drag to Explore the Galaxy ✨</h1>
  <p>Every star points to a memory</p>
</div>

<script>
  let scene, camera, renderer, particlesMesh;
  let mouseX = 0, mouseY = 0;
  let targetX = 0, targetY = 0;
  const photoCards = [];

  // Add your uploaded photo filenames here!
  const photoFiles = ['photo1.jpg', 'photo2.jpg', 'photo3.jpg'];

  function init() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030014, 0.02);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Create Particle Heart Galaxy
    const particleCount = 2500;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      // Mathematical Heart Curve Formula
      const t = Math.random() * Math.PI * 2;
      const u = (Math.random() - 0.5) * 2;
      
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      let z = u * 8;

      // Scale down and add scatter turbulence
      x = (x * 0.6) + (Math.random() - 0.5) * 4;
      y = (y * 0.6) + (Math.random() - 0.5) * 4;
      z = z + (Math.random() - 0.5) * 4;

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      // Neon Pastel Colors
      colors[i * 3] = 1.0;                             // Red
      colors[i * 3 + 1] = 0.4 + Math.random() * 0.4;   // Green
      colors[i * 3 + 2] = 0.8 + Math.random() * 0.2;   // Blue
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.25,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    });

    particlesMesh = new THREE.Points(geometry, material);
    scene.add(particlesMesh);

    // Load Floating Photo Cards inside 3D space
    const textureLoader = new THREE.TextureLoader();
    
    photoFiles.forEach((file, index) => {
      const texture = textureLoader.load(file);
      const photoGeo = new THREE.PlaneGeometry(3.5, 4.5);
      const photoMat = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9
      });

      const card = new THREE.Mesh(photoGeo, photoMat);
      
      // Position photos inside the orbit around the heart
      const angle = (index / photoFiles.length) * Math.PI * 2;
      card.position.set(Math.cos(angle) * 12, Math.sin(angle) * 6, (Math.random() - 0.5) * 8);
      
      scene.add(card);
      photoCards.push(card);
    });

    // Touch and Mouse Controls
    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('touchmove', onPointerMove);
    window.addEventListener('resize', onWindowResize);

    animate();
  }

  function onPointerMove(e) {
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);

    if (clientX && clientY) {
      mouseX = (clientX - window.innerWidth / 2) * 0.001;
      mouseY = (clientY - window.innerHeight / 2) * 0.001;
    }
  }

  function animate() {
    requestAnimationFrame(animate);

    targetX += (mouseX - targetX) * 0.05;
    targetY += (mouseY - targetY) * 0.05;

    // Rotate Galaxy
    particlesMesh.rotation.y += 0.003;
    particlesMesh.rotation.x = targetY * 0.5;
    particlesMesh.rotation.y += targetX * 0.5;

    // Orbit and Gently Float Photo Cards
    photoCards.forEach((card, idx) => {
      card.rotation.y += 0.005;
      card.position.y += Math.sin(Date.now() * 0.001 + idx) * 0.01;
    });

    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  window.onload = init;
</script>
</body>
</html>
